<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico Summary - Question Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCPHgq_0Nm13ZVJ-IKHB5d0aoichUi9hek",
          authDomain: "medico-summary-67b63.firebaseapp.com",
          projectId: "medico-summary-67b63",
          storageBucket: "medico-summary-67b63.firebasestorage.app",
          messagingSenderId: "964215872773",
          appId: "1:964215872773:web:0bffbd6dbf2f8bad782b6c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.firestoreTools = { collection, addDoc, onSnapshot, getDocs };
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Medico Summary</h1>
        <button onclick="openAdminModal()" class="bg-indigo-900 hover:bg-indigo-800 text-xs px-3 py-2 rounded text-white font-medium">
            Admin Access
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="container mx-auto p-4 flex-grow max-w-4xl">
        <!-- Controls / Selectors -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Select Module/Subject:</label>
                <select id="subject-select" onchange="loadQuestions()" class="w-full border rounded p-2 text-sm bg-gray-50">
                    <option value="All">All Subjects</option>
                    <option value="ENT">ENT</option>
                    <option value="Urology">Urology</option>
                    <option value="Orthopedic">Orthopedic</option>
                    <option value="Special Surgery">Special Surgery</option>
                    <option value="Internal Medicine 3">Internal Medicine 3</option>
                    <option value="Family Medicine">Family Medicine</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Select Source:</label>
                <select id="source-select" onchange="loadQuestions()" class="w-full border rounded p-2 text-sm bg-gray-50">
                    <option value="All">All Sources</option>
                </select>
            </div>
        </div>

        <!-- Question Display Container -->
        <div id="question-card" class="bg-white p-6 rounded-lg shadow-md hidden">
            <div class="flex justify-between items-center mb-4">
                <span id="q-subject" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded"></span>
                <span id="q-source" class="text-xs text-gray-500 font-medium"></span>
            </div>
            <h2 id="q-text" class="text-lg font-bold mb-4"></h2>
            
            <div id="q-options" class="space-y-2 mb-6"></div>

            <button id="show-exp-btn" onclick="toggleExplanation()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded text-sm mb-4">
                Show Explanation
            </button>

            <!-- Explanation Box -->
            <div id="exp-box" class="hidden bg-blue-50 border-l-4 border-blue-500 p-4 rounded text-sm text-gray-700">
                <h3 class="font-bold mb-1 text-blue-900">Educational Objective & Explanation:</h3>
                <!-- innerHTML updated -->
                <div id="exp-text"></div>
            </div>

            <div class="flex justify-between items-center mt-6 pt-4 border-t">
                <button onclick="prevQuestion()" class="bg-gray-500 text-white px-4 py-2 rounded text-sm">Previous</button>
                <span id="q-counter" class="text-xs text-gray-500"></span>
                <button onclick="nextQuestion()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm">Next</button>
            </div>
        </div>

        <div id="empty-state" class="text-center py-12 text-gray-500">
            Select a subject or source to load questions.
        </div>
    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-3 right-3 text-gray-500 hover:text-black">✕</button>
            <h2 class="text-lg font-bold mb-4 border-b pb-2">Admin Dashboard - Add Questions</h2>
            
            <!-- Bulk Upload Section -->
            <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-lg mb-6">
                <h3 class="font-bold text-sm text-indigo-900 mb-1">Bulk Upload (JSON File)</h3>
                <p class="text-xs text-gray-600 mb-3">Upload a JSON batch file containing dozens of questions at once.</p>
                <input type="file" id="bulk-file-input" accept=".json" class="block w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 mb-2"/>
                <button onclick="uploadBulkJSON()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded text-xs">
                    Upload Batch to Cloud
                </button>
            </div>

            <p class="text-xs text-center text-gray-400 my-2">-- OR ADD SINGLE QUESTION --</p>

            <!-- Single Question Form -->
            <form id="single-q-form" onsubmit="saveSingleQuestion(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">Subject:</label>
                    <select id="add-subject" class="w-full border rounded p-2 bg-gray-50" required>
                        <option value="ENT">ENT</option>
                        <option value="Urology">Urology</option>
                        <option value="Orthopedic">Orthopedic</option>
                        <option value="Special Surgery">Special Surgery</option>
                        <option value="Internal Medicine 3">Internal Medicine 3</option>
                        <option value="Family Medicine">Family Medicine</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Source Name:</label>
                    <input type="text" id="add-source" placeholder="e.g., Dr. Mosad MCQs" class="w-full border rounded p-2" required>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Question Text:</label>
                    <textarea id="add-text" rows="3" class="w-full border rounded p-2" required></textarea>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Options (4 Options):</label>
                    <input type="text" id="opt-0" placeholder="Option A" class="w-full border rounded p-1.5 mb-1" required>
                    <input type="text" id="opt-1" placeholder="Option B" class="w-full border rounded p-1.5 mb-1" required>
                    <input type="text" id="opt-2" placeholder="Option C" class="w-full border rounded p-1.5 mb-1" required>
                    <input type="text" id="opt-3" placeholder="Option D" class="w-full border rounded p-1.5 mb-1" required>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Correct Option Index (0 for A, 1 for B, 2 for C, 3 for D):</label>
                    <input type="number" id="add-correct" min="0" max="3" class="w-full border rounded p-2" required>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Explanation / Educational Objective:</label>
                    <textarea id="add-exp" rows="3" class="w-full border rounded p-2"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">
                    Save Question to Cloud
                </button>
            </form>
        </div>
    </div>

    <!-- Legacy data.js support -->
    <script src="data.js" onerror="console.log('No local data.js found, relying purely on Cloud Firestore.')"></script>

    <!-- App Logic -->
    <script>
        let allQuestions = [];
        let filteredQuestions = [];
        let currentIndex = 0;

        window.addEventListener('load', () => {
            const checkFirebase = setInterval(() => {
                if (window.db && window.firestoreTools) {
                    clearInterval(checkFirebase);
                    initCloudSync();
                }
            }, 100);
        });

        function initCloudSync() {
            const { collection, onSnapshot } = window.firestoreTools;
            let legacyData = (typeof questionsDatabase !== 'undefined') ? questionsDatabase : [];

            onSnapshot(collection(window.db, "questions"), (snapshot) => {
                let cloudQuestions = [];
                snapshot.forEach((doc) => {
                    cloudQuestions.push({ id: doc.id, ...doc.data() });
                });
                
                allQuestions = [...legacyData, ...cloudQuestions];
                populateSources();
                loadQuestions();
            });
        }

        function populateSources() {
            const sourceSelect = document.getElementById('source-select');
            const currentSubject = document.getElementById('subject-select').value;
            
            const sources = new Set();
            allQuestions.forEach(q => {
                if (currentSubject === 'All' || q.subject === currentSubject) {
                    if (q.source) sources.add(q.source);
                }
            });

            sourceSelect.innerHTML = '<option value="All">All Sources</option>';
            sources.forEach(src => {
                const opt = document.createElement('option');
                opt.value = src;
                opt.textContent = src;
                sourceSelect.appendChild(opt);
            });
        }

        function loadQuestions() {
            const subject = document.getElementById('subject-select').value;
            const source = document.getElementById('source-select').value;

            filteredQuestions = allQuestions.filter(q => {
                const matchSubject = (subject === 'All' || q.subject === subject);
                const matchSource = (source === 'All' || q.source === source);
                return matchSubject && matchSource;
            });

            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const card = document.getElementById('question-card');
            const emptyState = document.getElementById('empty-state');

            if (filteredQuestions.length === 0) {
                card.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            card.classList.remove('hidden');

            const q = filteredQuestions[currentIndex];
            document.getElementById('q-subject').innerText = q.subject || 'General';
            document.getElementById('q-source').innerText = q.source || 'General Source';
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('q-counter').innerText = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;

            document.getElementById('exp-box').classList.add('hidden');
            document.getElementById('show-exp-btn').classList.add('hidden');

            const optsContainer = document.getElementById('q-options');
            optsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 border rounded text-sm hover:bg-gray-100 transition";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, q.correct, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, correctIdx, btn) {
            const buttons = document.getElementById('q-options').children;
            for (let b of buttons) {
                b.disabled = true;
                b.classList.remove('hover:bg-gray-100');
            }

            if (selectedIdx === correctIdx) {
                btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
            } else {
                btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                buttons[correctIdx].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
            }

            const q = filteredQuestions[currentIndex];
            if (q.explanation) {
                document.getElementById('exp-text').innerHTML = q.explanation;
                document.getElementById('show-exp-btn').classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            document.getElementById('exp-box').classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < filteredQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        async function saveSingleQuestion(e) {
            e.preventDefault();
            const { collection, addDoc } = window.firestoreTools;

            const newQ = {
                subject: document.getElementById('add-subject').value,
                source: document.getElementById('add-source').value,
                question: document.getElementById('add-text').value,
                options: [
                    document.getElementById('opt-0').value,
                    document.getElementById('opt-1').value,
                    document.getElementById('opt-2').value,
                    document.getElementById('opt-3').value
                ],
                correct: parseInt(document.getElementById('add-correct').value),
                explanation: document.getElementById('add-exp').value
            };

            try {
                await addDoc(collection(window.db, "questions"), newQ);
                alert("Question saved successfully to Cloud Database!");
                document.getElementById('single-q-form').reset();
                closeAdminModal();
            } catch (err) {
                alert("Error saving question: " + err.message);
            }
        }

        function uploadBulkJSON() {
            const fileInput = document.getElementById('bulk-file-input');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a JSON file first.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const questionsArray = JSON.parse(e.target.result);
                    if (!Array.isArray(questionsArray)) {
                        alert("Invalid JSON structure. File must contain an array of question objects.");
                        return;
                    }

                    const { collection, addDoc } = window.firestoreTools;
                    let count = 0;

                    for (let q of questionsArray) {
                        await addDoc(collection(window.db, "questions"), q);
                        count++;
                    }

                    alert(`Success! Uploaded ${count} questions to the Cloud Database.`);
                    fileInput.value = '';
                    closeAdminModal();
                } catch (err) {
                    alert("Error parsing or uploading JSON file: " + err.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
