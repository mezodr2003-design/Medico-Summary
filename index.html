<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico Summary - Question Bank</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400">
                    <i class="fa-solid fa-stethoscope text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-100 leading-tight">Medico Summary</h1>
                    <p class="text-xs text-slate-400">High-Yield USMLE Question Bank</p>
                </div>
            </div>
            
            <button onclick="requestAdminAccess()" class="text-xs bg-slate-700/60 hover:bg-slate-700 border border-slate-600/50 px-3 py-2 rounded-xl text-slate-300 transition flex items-center gap-2">
                <i class="fa-solid fa-lock text-slate-400"></i>
                <span class="hidden sm:inline">Admin Access</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Quiz Card Header -->
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">System / Topic:</span>
                <span id="q-category" class="text-xs font-semibold bg-blue-500/10 text-blue-400 px-3 py-1 rounded-lg border border-blue-500/20">Cardiology</span>
            </div>
            <div class="text-xs font-medium text-slate-400" id="q-counter">
                Question 1 of 1
            </div>
        </div>

        <!-- Question View Box -->
        <div id="quiz-card" class="bg-slate-800/90 rounded-2xl border border-slate-700/80 p-6 shadow-2xl space-y-6">
            
            <!-- Question Stem -->
            <p id="q-text" class="text-base md:text-lg leading-relaxed font-medium text-slate-100">
                Loading clinical vignette...
            </p>

            <!-- Answer Options -->
            <div id="q-options" class="space-y-3">
                <!-- Rendered dynamically -->
            </div>

            <!-- Explanation Box (UWorld Style) -->
            <div id="explanation-box" class="hidden mt-6 p-5 rounded-xl bg-slate-900/90 border border-emerald-500/30 space-y-4">
                <div class="flex items-center gap-2 text-emerald-400 font-bold border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                    <span>Educational Objective & Explanation</span>
                </div>
                <p id="exp-text" class="text-sm leading-relaxed text-slate-300">
                    --
                </p>
            </div>

            <!-- Footer Controls -->
            <div class="flex justify-between items-center pt-4 border-t border-slate-700/60">
                <button onclick="prevQuestion()" class="bg-slate-700/60 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition text-slate-300">
                    <i class="fa-solid fa-arrow-left me-1"></i> Previous
                </button>
                <button onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                    <span>Next</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Protected Admin Panel -->
        <div id="admin-panel" class="hidden bg-slate-800/90 rounded-2xl border border-amber-500/40 p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield"></i> Admin Panel (Active Session)
                </h3>
                <button onclick="closeAdminPanel()" class="text-xs bg-slate-700 px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white">Close</button>
            </div>
            
            <p class="text-xs text-slate-400">Add questions directly to the current session or generate output for permanent saving.</p>
            
            <div class="space-y-3">
                <input type="text" id="new-cat" placeholder="Category / System (e.g., GI, Renal, Cardiology)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                <textarea id="new-q" placeholder="Clinical Question Stem..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-slate-100 h-24 focus:outline-none focus:border-amber-500"></textarea>
                <textarea id="new-exp" placeholder="Educational Objective & UWorld Explanation..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-slate-100 h-24 focus:outline-none focus:border-amber-500"></textarea>
                <button onclick="addNewQuestionFromAdmin()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-3 rounded-xl transition text-white shadow-lg shadow-amber-600/20">
                    Add Question To Session
                </button>
            </div>
        </div>

    </main>

    <!-- Embedded Initial Data & App Logic -->
    <script>
        // Password for Admin Access
        const ADMIN_PASS = "med2026";

        let questionsData = [
            {
                id: 1,
                category: "Cardiology",
                question: "A 55-year-old male presents to the emergency department with severe crushing substernal chest pain radiating to the left jaw and arm. ECG reveals ST-segment elevation in leads V1 through V4. Cardiac biomarkers are elevated. What is the most appropriate next step in management?",
                options: [
                    "Immediate Percutaneous Coronary Intervention (PCI)",
                    "Administration of Oral Beta-blockers only",
                    "Emergent Aortic Valve Replacement",
                    "Reassurance and Outpatient Echocardiogram"
                ],
                correct: 0,
                explanation: "Educational Objective: Acute Anterior Wall Myocardial Infarction (STEMI) involving leads V1-V4 results from occlusion of the Left Anterior Descending (LAD) artery. The primary goal is immediate reperfusion via Percutaneous Coronary Intervention (PCI) within 90 minutes of door-to-balloon time."
            }
        ];

        let currentIndex = 0;

        function loadQuestion() {
            const q = questionsData[currentIndex];
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-counter').innerText = `Question ${currentIndex + 1} of ${questionsData.length}`;
            document.getElementById('q-text').innerText = q.question;

            const optsBox = document.getElementById('q-options');
            optsBox.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/40 transition flex justify-between items-center group';
                btn.innerHTML = `<span class="text-sm font-medium text-slate-200 group-hover:text-white">${opt}</span> <i class="fa-regular fa-circle text-slate-500 text-sm"></i>`;
                btn.onclick = () => selectOption(idx, q.correct, btn);
                optsBox.appendChild(btn);
            });

            document.getElementById('explanation-box').classList.add('hidden');
        }

        function selectOption(selected, correct, btnElement) {
            const expBox = document.getElementById('explanation-box');
            document.getElementById('exp-text').innerText = questionsData[currentIndex].explanation;
            expBox.classList.remove('hidden');

            // Reset other buttons
            const allBtns = document.getElementById('q-options').children;
            for(let btn of allBtns) {
                btn.className = 'w-full text-left p-4 rounded-xl bg-slate-700/20 border border-slate-700/40 opacity-60 flex justify-between items-center';
            }

            if (selected === correct) {
                btnElement.className = 'w-full text-left p-4 rounded-xl bg-emerald-950/60 border border-emerald-500 text-emerald-200 font-semibold flex justify-between items-center opacity-100 shadow-lg shadow-emerald-950/40';
                btnElement.querySelector('i').className = 'fa-solid fa-circle-check text-emerald-400 text-base';
            } else {
                btnElement.className = 'w-full text-left p-4 rounded-xl bg-rose-950/60 border border-rose-500 text-rose-200 font-semibold flex justify-between items-center opacity-100 shadow-lg shadow-rose-950/40';
                btnElement.querySelector('i').className = 'fa-solid fa-circle-xmark text-rose-400 text-base';
            }
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function requestAdminAccess() {
            const pwd = prompt("Enter Admin Password:");
            if (pwd === ADMIN_PASS) {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
            } else if (pwd !== null) {
                alert("Incorrect Password!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function addNewQuestionFromAdmin() {
            const cat = document.getElementById('new-cat').value || "General";
            const qText = document.getElementById('new-q').value;
            const expText = document.getElementById('new-exp').value;

            if(!qText) return alert("Please enter the question text.");

            questionsData.push({
                id: questionsData.length + 1,
                category: cat,
                question: qText,
                options: ["Option A", "Option B", "Option C", "Option D"],
                correct: 0,
                explanation: expText
            });

            alert("New question added to this session!");
            document.getElementById('new-q').value = '';
            document.getElementById('new-exp').value = '';
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
