<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico Summary - Pro QBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .q-matrix-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; border-radius: 8px; border: 1px solid #475569; background: transparent; color: #cbd5e1; transition: all 0.2s; }
        .q-matrix-btn:hover { border-color: #94a3b8; }
        .q-matrix-btn.active { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }
        .q-matrix-btn.correct { background-color: #059669; border-color: #059669; color: white; }
        .q-matrix-btn.incorrect { background-color: #e11d48; border-color: #e11d48; color: white; }
        
        .flag-marker { position: absolute; top: -4px; right: -4px; color: #f59e0b; font-size: 0.7rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
        
        /* Options Styling */
        .option-btn { transition: all 0.2s; border: 1px solid #334155; }
        .option-btn:hover:not(:disabled) { background-color: #334155; border-color: #475569; }
        .option-btn.selected-correct { background-color: rgba(5, 150, 105, 0.2); border-color: #059669; color: #34d399; }
        .option-btn.selected-incorrect { background-color: rgba(225, 29, 72, 0.2); border-color: #e11d48; color: #fb7185; }
        .option-btn.actual-correct { border-color: #059669; box-shadow: inset 0 0 0 1px #059669; }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans antialiased flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-14 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
                <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white">
                    <i class="fa-solid fa-stethoscope"></i>
                </div>
                <h1 class="font-bold text-slate-100 tracking-wide">Medico Summary</h1>
            </div>
            
            <div id="quiz-header-controls" class="hidden flex items-center gap-4">
                <div id="timer-display" class="hidden items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 font-mono text-sm text-amber-400">
                    <i class="fa-regular fa-clock"></i> <span id="time-left">00:00:00</span>
                </div>
                <button onclick="endQuizEarly()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">End Block</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 flex flex-col">
        
        <!-- ================= DASHBOARD SCREEN ================= -->
        <div id="dashboard-screen" class="max-w-3xl mx-auto w-full py-8 space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-6">
                <div>
                    <h2 class="text-2xl font-bold text-white">Create Test Block</h2>
                    <p class="text-sm text-slate-400 mt-1">Configure your practice session.</p>
                </div>

                <!-- Test Mode -->
                <div class="grid grid-cols-2 gap-3 border-b border-slate-700 pb-6">
                    <label class="relative flex p-4 rounded-xl border border-slate-600 cursor-pointer hover:bg-slate-700/50 transition">
                        <input type="radio" name="test-mode" value="tutor" checked class="mt-1">
                        <div class="ml-3">
                            <span class="block font-semibold text-slate-200">Tutor Mode</span>
                            <span class="block text-xs text-slate-400">Answers shown immediately</span>
                        </div>
                    </label>
                    <label class="relative flex p-4 rounded-xl border border-slate-600 cursor-pointer hover:bg-slate-700/50 transition">
                        <input type="radio" name="test-mode" value="timed" class="mt-1">
                        <div class="ml-3">
                            <span class="block font-semibold text-slate-200">Timed Mode</span>
                            <span class="block text-xs text-slate-400">1.5 mins per question</span>
                        </div>
                    </label>
                </div>

                <!-- Filters -->
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Subject</label>
                            <select id="filter-subject" onchange="updateFilters('subject')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:border-blue-500">
                                <option value="all">All Subjects</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Branch</label>
                            <select id="filter-branch" onchange="updateFilters('branch')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:border-blue-500">
                                <option value="all">All Branches</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Subtype</label>
                            <select id="filter-subtype" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:border-blue-500">
                                <option value="all">All Subtypes</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Question Pool Status -->
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700 space-y-3">
                    <label class="block text-xs font-semibold text-slate-400">Question Pool</label>
                    <div class="flex flex-wrap gap-2">
                        <label class="flex items-center gap-2 bg-slate-800 px-3 py-2 rounded-lg border border-slate-600 cursor-pointer">
                            <input type="radio" name="pool-type" value="all" checked> <span class="text-sm">All Questions</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-800 px-3 py-2 rounded-lg border border-red-900/50 text-red-300 cursor-pointer">
                            <input type="radio" name="pool-type" value="incorrect"> <span class="text-sm">Incorrect Only</span>
                        </label>
                        <label class="flex items-center gap-2 bg-slate-800 px-3 py-2 rounded-lg border border-amber-900/50 text-amber-300 cursor-pointer">
                            <input type="radio" name="pool-type" value="flagged"> <span class="text-sm">Flagged Only</span>
                        </label>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-4">
                    <span id="available-count" class="text-sm font-semibold text-blue-400">Loading questions...</span>
                    <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-8 rounded-lg transition shadow-lg">
                        Generate Test
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= QUIZ SCREEN ================= -->
        <div id="quiz-screen" class="hidden flex-grow flex flex-col lg:flex-row gap-6">
            
            <!-- Left Column: Question Area -->
            <div class="flex-grow flex flex-col space-y-4 max-w-4xl w-full">
                <!-- Meta Tags & Flag -->
                <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                    <div class="flex flex-wrap gap-2 text-xs font-medium">
                        <span id="q-tag-branch" class="bg-blue-900/40 text-blue-300 px-2.5 py-1 rounded">Branch</span>
                        <span id="q-tag-subtype" class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded">Subtype</span>
                    </div>
                    <button id="flag-btn" onclick="toggleFlag()" class="text-sm flex items-center gap-2 text-slate-400 hover:text-amber-400 transition">
                        <i class="fa-regular fa-bookmark"></i> <span>Flag Question</span>
                    </button>
                </div>

                <!-- Question Text -->
                <h3 class="text-xs font-bold text-slate-400 tracking-wider">QUESTION <span id="q-current-num">1</span> OF <span id="q-total-num">30</span></h3>
                <p id="q-text" class="text-lg leading-relaxed text-slate-100 font-medium">Loading...</p>

                <!-- Options -->
                <div id="q-options" class="space-y-2 mt-4">
                    <!-- Rendered dynamically -->
                </div>

                <!-- Explanation -->
                <div id="explanation-box" class="hidden mt-6 bg-slate-800/80 border-l-4 border-emerald-500 rounded-r-xl p-5 space-y-3 shadow-lg">
                    <h4 class="font-bold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-book-medical"></i> Educational Objective
                    </h4>
                    <p id="exp-text" class="text-sm leading-relaxed text-slate-200"></p>
                </div>

                <!-- Footer Navigation -->
                <div class="mt-auto pt-6 flex justify-between items-center">
                    <button onclick="navigate(-1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-5 py-2.5 rounded-lg text-sm transition">Previous</button>
                    <button onclick="navigate(1)" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-2.5 rounded-lg text-sm transition">Next</button>
                </div>
            </div>

            <!-- Right Column: Sidebar (Matrix & Stats) -->
            <div class="w-full lg:w-80 flex-shrink-0 space-y-4">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg sticky top-20">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-border-all text-blue-400"></i> Question Matrix</h3>
                        <span id="answered-count" class="text-xs text-slate-400">0 / 30 Answered</span>
                    </div>
                    
                    <!-- Legend -->
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-400 mb-4">
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-500"></span> Unanswered</div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Correct</div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Incorrect</div>
                        <div class="flex items-center gap-1"><i class="fa-solid fa-bookmark text-amber-500 text-[10px]"></i> Flagged</div>
                    </div>

                    <!-- Number Grid -->
                    <div id="matrix-grid" class="flex flex-wrap gap-1.5 justify-start">
                        <!-- Buttons injected here -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Import Data -->
    <script src="data.js"></script>

    <!-- Logic Engine -->
    <script>
        // App State
        let userStats = JSON.parse(localStorage.getItem('medico_stats')) || { incorrect: [], flagged: [] };
        let activeBlock = [];
        let currentIdx = 0;
        let blockState = []; // Tracks current session progress
        let testMode = 'tutor'; 
        let timerInterval;
        let timeRemaining = 0;

        // --- 1. Initialization & Filters ---
        function initApp() {
            if(typeof questionsDatabase === 'undefined') {
                document.getElementById('available-count').innerText = "Error: data.js not found or empty.";
                return;
            }
            populateFilters();
            updateAvailableCount();
        }

        function populateFilters() {
            const subjects = [...new Set(questionsDatabase.map(q => q.subject))];
            const subjSelect = document.getElementById('filter-subject');
            subjects.forEach(s => subjSelect.innerHTML += `<option value="${s}">${s}</option>`);
        }

        function updateFilters(changedLevel) {
            const subj = document.getElementById('filter-subject').value;
            const branchSelect = document.getElementById('filter-branch');
            const subtypeSelect = document.getElementById('filter-subtype');

            if (changedLevel === 'subject') {
                branchSelect.innerHTML = '<option value="all">All Branches</option>';
                subtypeSelect.innerHTML = '<option value="all">All Subtypes</option>';
                if (subj !== 'all') {
                    const branches = [...new Set(questionsDatabase.filter(q => q.subject === subj).map(q => q.branch))];
                    branches.forEach(b => branchSelect.innerHTML += `<option value="${b}">${b}</option>`);
                }
            } else if (changedLevel === 'branch') {
                subtypeSelect.innerHTML = '<option value="all">All Subtypes</option>';
                const branch = branchSelect.value;
                if (branch !== 'all') {
                    const subtypes = [...new Set(questionsDatabase.filter(q => q.branch === branch && (subj==='all' || q.subject===subj)).map(q => q.subtype))];
                    subtypes.forEach(s => subtypeSelect.innerHTML += `<option value="${s}">${s}</option>`);
                }
            }
            updateAvailableCount();
        }

        function getFilteredQuestions() {
            const subj = document.getElementById('filter-subject').value;
            const branch = document.getElementById('filter-branch').value;
            const subtype = document.getElementById('filter-subtype').value;
            const pool = document.querySelector('input[name="pool-type"]:checked').value;

            return questionsDatabase.filter(q => {
                const matchSubj = subj === 'all' || q.subject === subj;
                const matchBranch = branch === 'all' || q.branch === branch;
                const matchSubtype = subtype === 'all' || q.subtype === subtype;
                
                let matchPool = true;
                if (pool === 'incorrect') matchPool = userStats.incorrect.includes(q.id);
                if (pool === 'flagged') matchPool = userStats.flagged.includes(q.id);

                return matchSubj && matchBranch && matchSubtype && matchPool;
            });
        }

        function updateAvailableCount() {
            const count = getFilteredQuestions().length;
            document.getElementById('available-count').innerText = `${count} Questions Available`;
        }

        // --- 2. Test Engine ---
        function startQuiz() {
            const pool = getFilteredQuestions();
            if (pool.length === 0) return alert("No questions match your criteria.");

            activeBlock = pool;
            blockState = activeBlock.map(q => ({ answered: false, selected: null, correct: false }));
            currentIdx = 0;
            testMode = document.querySelector('input[name="test-mode"]:checked').value;

            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-header-controls').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');

            if (testMode === 'timed') {
                timeRemaining = activeBlock.length * 90; // 1.5 mins per question
                document.getElementById('timer-display').classList.remove('hidden');
                document.getElementById('timer-display').classList.add('flex');
                timerInterval = setInterval(updateTimer, 1000);
            }

            renderMatrix();
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeBlock[currentIdx];
            const state = blockState[currentIdx];
            const isFlagged = userStats.flagged.includes(q.id);

            document.getElementById('q-current-num').innerText = currentIdx + 1;
            document.getElementById('q-total-num').innerText = activeBlock.length;
            document.getElementById('q-tag-branch').innerText = q.branch || "General";
            document.getElementById('q-tag-subtype').innerText = q.subtype || "General";
            document.getElementById('q-text').innerText = q.question;

            // Flag UI
            const flagBtn = document.getElementById('flag-btn');
            if(isFlagged) {
                flagBtn.innerHTML = `<i class="fa-solid fa-bookmark"></i> <span class="text-amber-400 font-bold">Flagged</span>`;
                flagBtn.classList.add('text-amber-400');
            } else {
                flagBtn.innerHTML = `<i class="fa-regular fa-bookmark"></i> <span>Flag Question</span>`;
                flagBtn.classList.remove('text-amber-400');
            }

            const optsBox = document.getElementById('q-options');
            optsBox.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const letter = String.fromCharCode(65 + idx);
                btn.className = 'option-btn w-full text-left p-4 rounded-xl flex items-start gap-4 cursor-pointer bg-slate-900/50';
                btn.innerHTML = `<span class="flex-shrink-0 w-8 h-8 rounded-full border border-slate-600 flex items-center justify-center font-bold text-slate-400">${letter}</span> 
                                 <span class="mt-1">${opt}</span>`;
                
                if (state.answered) {
                    btn.disabled = true;
                    btn.classList.add('cursor-default');
                    // Reveal logic for Tutor mode or finished Timed mode
                    if (testMode === 'tutor') {
                        if (idx === q.correct) {
                            btn.classList.add('actual-correct');
                            btn.querySelector('span').classList.add('bg-emerald-600', 'text-white', 'border-emerald-600');
                        }
                        if (idx === state.selected && !state.correct) {
                            btn.classList.add('selected-incorrect');
                            btn.querySelector('span').classList.add('bg-rose-600', 'text-white', 'border-rose-600');
                        }
                    } else {
                        // Timed mode (before submit) just shows selected
                        if (idx === state.selected) {
                            btn.classList.add('bg-slate-700', 'border-slate-500');
                            btn.querySelector('span').classList.add('bg-slate-500', 'text-white');
                        }
                    }
                } else {
                    btn.onclick = () => submitAnswer(idx);
                }
                optsBox.appendChild(btn);
            });

            // Explanation visibility
            const expBox = document.getElementById('explanation-box');
            if (state.answered && testMode === 'tutor') {
                document.getElementById('exp-text').innerText = q.explanation;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            updateMatrixUI();
        }

        function submitAnswer(selectedIndex) {
            const q = activeBlock[currentIdx];
            const isCorrect = (selectedIndex === q.correct);
            
            blockState[currentIdx] = { answered: true, selected: selectedIndex, correct: isCorrect };

            // Update persistent stats
            if (!isCorrect && !userStats.incorrect.includes(q.id)) {
                userStats.incorrect.push(q.id);
            } else if (isCorrect) {
                userStats.incorrect = userStats.incorrect.filter(id => id !== q.id); // Remove from incorrect if they got it right
            }
            saveStats();

            loadQuestion();
            updateMatrixUI();
        }

        function toggleFlag() {
            const qId = activeBlock[currentIdx].id;
            const idx = userStats.flagged.indexOf(qId);
            if (idx > -1) {
                userStats.flagged.splice(idx, 1);
            } else {
                userStats.flagged.push(qId);
            }
            saveStats();
            loadQuestion();
        }

        function navigate(dir) {
            const newIdx = currentIdx + dir;
            if (newIdx >= 0 && newIdx < activeBlock.length) {
                currentIdx = newIdx;
                loadQuestion();
            }
        }

        // --- 3. Sidebar Matrix ---
        function renderMatrix() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            activeBlock.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.className = 'q-matrix-btn relative';
                btn.id = `mat-btn-${i}`;
                btn.innerText = i + 1;
                btn.onclick = () => { currentIdx = i; loadQuestion(); };
                grid.appendChild(btn);
            });
        }

        function updateMatrixUI() {
            let answeredCount = 0;
            activeBlock.forEach((q, i) => {
                const btn = document.getElementById(`mat-btn-${i}`);
                const state = blockState[i];
                const isFlagged = userStats.flagged.includes(q.id);
                
                btn.className = 'q-matrix-btn relative'; // Reset
                
                if (i === currentIdx) btn.classList.add('active');
                
                if (state.answered) {
                    answeredCount++;
                    if (testMode === 'tutor') {
                        btn.classList.add(state.correct ? 'correct' : 'incorrect');
                    } else {
                        btn.classList.add('bg-slate-700'); // Just mark as answered in timed
                    }
                }
                
                // Add flag marker if needed
                btn.innerHTML = `<span>${i+1}</span>` + (isFlagged ? `<i class="fa-solid fa-bookmark flag-marker"></i>` : '');
            });
            
            document.getElementById('answered-count').innerText = `${answeredCount} / ${activeBlock.length} Answered`;
        }

        // --- 4. Utilities ---
        function saveStats() {
            localStorage.setItem('medico_stats', JSON.stringify(userStats));
        }

        function updateTimer() {
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("Time is up! Switching to review mode.");
                testMode = 'tutor'; // Auto switch to tutor to see explanations
                loadQuestion();
                return;
            }
            timeRemaining--;
            const hrs = Math.floor(timeRemaining / 3600).toString().padStart(2, '0');
            const mins = Math.floor((timeRemaining % 3600) / 60).toString().padStart(2, '0');
            const secs = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('time-left').innerText = `${hrs}:${mins}:${secs}`;
        }

        function endQuizEarly() {
            if(confirm("Are you sure you want to exit this block? Progress is saved.")) {
                goHome();
            }
        }

        function goHome() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('flex');
            document.getElementById('quiz-header-controls').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            updateAvailableCount(); // Refresh counts based on new incorrect/flagged status
        }

        window.onload = initApp;
    </script>
</body>
</html>
