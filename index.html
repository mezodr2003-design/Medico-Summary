<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico Summary - Question Bank</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-stethoscope text-blue-400"></i> Medico Summary Bank
            </h1>
            <div id="admin-badge" class="hidden bg-amber-500/20 text-amber-300 text-xs px-3 py-1 rounded-full border border-amber-500/30">
                <i class="fa-solid fa-user-shield me-1"></i> Admin Mode
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Controls Bar -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-4">
            <div>
                <span class="text-sm text-slate-400">Current Category:</span>
                <span id="current-category" class="font-bold text-blue-300 ml-2">All Questions</span>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleAdminView()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-slate-300 transition">
                    <i class="fa-solid fa-gear me-1"></i> Admin Panel
                </button>
            </div>
        </div>

        <!-- Question View Box -->
        <div id="quiz-card" class="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <span id="q-category" class="text-xs font-semibold bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-700">General</span>
                <span id="q-counter" class="text-xs text-slate-400">Question 1</span>
            </div>

            <p id="q-text" class="text-lg leading-relaxed font-medium text-slate-100">
                Loading question...
            </p>

            <div id="q-options" class="space-y-3">
                <!-- Options rendered dynamically -->
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-6 p-5 rounded-xl bg-slate-900/80 border border-emerald-500/30 space-y-3">
                <div class="flex items-center gap-2 text-emerald-400 font-bold">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Explanation & Educational Objective</span>
                </div>
                <p id="exp-text" class="text-sm leading-relaxed text-slate-300">
                    --
                </p>
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-700">
                <button onclick="prevQuestion()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">Previous</button>
                <button onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-semibold transition">Next</button>
            </div>
        </div>

        <!-- Admin Panel (Modular / Hidden by default) -->
        <div id="admin-panel" class="hidden bg-slate-800 rounded-2xl border border-amber-500/30 p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Add New Question
            </h3>
            <p class="text-xs text-slate-400">Easily expand your item bank manually or via AI paste.</p>
            <div class="space-y-3">
                <input type="text" id="new-cat" placeholder="Category (e.g., Cardiology)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm text-slate-100">
                <textarea id="new-q" placeholder="Question stem..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm text-slate-100 h-24"></textarea>
                <textarea id="new-exp" placeholder="Detailed explanation and Educational Objective..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm text-slate-100 h-20"></textarea>
                <button onclick="addNewQuestionFromAdmin()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-3 rounded-lg transition text-white">Save Question</button>
            </div>
        </div>

    </main>

    <!-- Data & Logic -->
    <script>
        let questionsData = [
            {
                id: 1,
                category: "Cardiology",
                question: "A 55-year-old male presents to the emergency department with severe crushing chest pain radiating to the left arm. ECG shows ST-segment elevation in leads V1-V4. What is the most likely diagnosis?",
                options: [
                    "Aortic Dissection",
                    "Anterior Wall Myocardial Infarction",
                    "Acute Pericarditis",
                    "Pulmonary Embolism"
                ],
                correct: 1,
                explanation: "ST-elevation in leads V1-V4 indicates an Acute Anterior Wall MI, typically caused by occlusion of the Left Anterior Descending (LAD) coronary artery."
            }
        ];

        let currentIndex = 0;

        function loadQuestion() {
            const q = questionsData[currentIndex];
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-counter').innerText = `Question ${currentIndex + 1} of ${questionsData.length}`;
            document.getElementById('q-text').innerText = q.question;

            const optsBox = document.getElementById('q-options');
            optsBox.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600/50 transition flex justify-between items-center';
                btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-slate-500"></i>`;
                btn.onclick = () => selectOption(idx, q.correct, btn);
                optsBox.appendChild(btn);
            });

            document.getElementById('explanation-box').classList.add('hidden');
        }

        function selectOption(selected, correct, btnElement) {
            const expBox = document.getElementById('explanation-box');
            document.getElementById('exp-text').innerText = questionsData[currentIndex].explanation;
            expBox.classList.remove('hidden');

            if (selected === correct) {
                btnElement.className = 'w-full text-left p-4 rounded-xl bg-emerald-950/60 border border-emerald-500 text-emerald-200 font-semibold flex justify-between items-center';
            } else {
                btnElement.className = 'w-full text-left p-4 rounded-xl bg-rose-950/60 border border-rose-500 text-rose-200 font-semibold flex justify-between items-center';
            }
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function toggleAdminView() {
            const adminPanel = document.getElementById('admin-panel');
            adminPanel.classList.toggle('hidden');
        }

        function addNewQuestionFromAdmin() {
            const cat = document.getElementById('new-cat').value || "General";
            const qText = document.getElementById('new-q').value;
            const expText = document.getElementById('new-exp').value;

            if(!qText) return alert("Please enter the question text.");

            questionsData.push({
                id: questionsData.length + 1,
                category: cat,
                question: qText,
                options: ["Option A", "Option B", "Option C", "Option D"],
                correct: 0,
                explanation: expText
            });

            alert("Question added successfully!");
            document.getElementById('new-q').value = '';
            document.getElementById('new-exp').value = '';
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
