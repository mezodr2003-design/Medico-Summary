<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico Library - Notion Style Resources</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCPHgq_0Nm13ZVJ-IKHB5d0aoichUi9hek",
          authDomain: "medico-summary-67b63.firebaseapp.com",
          projectId: "medico-summary-67b63",
          storageBucket: "medico-summary-67b63.firebasestorage.app",
          messagingSenderId: "964215872773",
          appId: "1:964215872773:web:0bffbd6dbf2f8bad782b6c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.firebaseAuth = auth;
        window.firestoreTools = { collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy };
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .notion-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .tag-pdf { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .tag-image { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .tag-table { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .tag-doc { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .tree-toggle-icon { transition: transform 0.2s ease; }
        .tree-toggle-icon.open { transform: rotate(90deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-14 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-slate-600 shadow-md" onerror="this.src='https://via.placeholder.com/40'">
                <h1 class="font-bold tracking-wide text-base">Medico Resource Library</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="admin-upload-btn" onclick="openUploadModal()" class="hidden text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded-lg transition items-center gap-2 shadow">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Resource
                </button>
                <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 px-3 py-2 rounded-lg transition font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-blue-400"></i> Back to QBank
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 md:p-6 space-y-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="library-search" oninput="filterResources()" placeholder="Search resources..." class="w-full bg-slate-900 border border-slate-700 pl-9 pr-4 py-2 rounded-xl text-sm outline-none focus:border-indigo-500">
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-between md:justify-end">
                <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700 text-xs">
                    <button id="type-filter-all" onclick="setTypeFilter('all')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition">All</button>
                    <button id="type-filter-pdf" onclick="setTypeFilter('pdf')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">PDFs</button>
                    <button id="type-filter-image" onclick="setTypeFilter('image')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">Images</button>
                    <button id="type-filter-table" onclick="setTypeFilter('table')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">Tables</button>
                    <button id="type-filter-doc" onclick="setTypeFilter('doc')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">Word</button>
                </div>
            </div>
        </div>

        <div id="resources-tree-container" class="space-y-4">
            <p class="text-center text-slate-400 py-12 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading Resource Library...</p>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-indigo-500/40 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-base font-bold text-indigo-400 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Resource</h3>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="upload-form" onsubmit="handleResourceSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Resource Title *</label>
                    <input type="text" id="res-title" required placeholder="e.g. Otosclerosis HY points" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Subject *</label>
                        <input type="text" id="res-subject" required list="existing-subjects" placeholder="e.g. ENT" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                        <datalist id="existing-subjects"></datalist>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Branch (Optional)</label>
                        <input type="text" id="res-branch" list="existing-branches" placeholder="e.g. Otology" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                        <datalist id="existing-branches"></datalist>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Category / Type *</label>
                    <select id="res-type" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                        <option value="pdf">📄 PDF / Summary</option>
                        <option value="image">🖼️ Image / Diagram / X-Ray</option>
                        <option value="table">📊 Table / Flowchart</option>
                        <option value="doc">📝 Word Document</option>
                    </select>
                </div>

                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/80">
                    <label class="block text-xs font-bold text-indigo-300 mb-2">Select File from Device *</label>
                    <input type="file" id="res-file" required class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 transition"/>
                </div>

                <div id="upload-status" class="hidden text-center text-xs text-indigo-400 font-semibold py-1">
                    <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Uploading resource directly...
                </div>

                <button type="submit" id="submit-upload-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl text-white transition shadow-lg">Upload & Save to Library</button>
            </form>
        </div>
    </div>

    <script src="admins.js" onerror="console.log('No admins.js found.')"></script>

    <script>
        const SUPER_ADMIN_EMAIL = window.SUPER_ADMIN_EMAIL || "naheha1614@ensproxy.com";
        const ADMIN_EMAILS = window.ALLOWED_ADMIN_EMAILS || [SUPER_ADMIN_EMAIL];

        let rawResources = [];
        let currentTypeFilter = 'all';
        let isAdmin = false;

        function initLibrary() {
            const checkFirebase = setInterval(async () => {
                if (window.db && window.firestoreTools && window.firebaseAuth) {
                    clearInterval(checkFirebase);
                    window.firebaseAuth.onAuthStateChanged(user => {
                        const adminBtn = document.getElementById('admin-upload-btn');
                        if (user && ADMIN_EMAILS.includes(user.email)) {
                            isAdmin = true;
                            adminBtn.classList.remove('hidden'); adminBtn.classList.add('flex');
                        } else {
                            isAdmin = false;
                            adminBtn.classList.add('hidden');
                        }
                        fetchResources();
                    });
                }
            }, 200);
        }

        async function fetchResources() {
            try {
                const { collection, getDocs, query, orderBy } = window.firestoreTools;
                const q = query(collection(window.db, "resources"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                rawResources = [];
                querySnapshot.forEach(doc => { rawResources.push({ id: doc.id, ...doc.data() }); });
                populateDatalists(); renderResources();
            } catch (err) {
                document.getElementById('resources-tree-container').innerHTML = `<p class="text-center text-rose-400 py-8">Failed to load resources.</p>`;
            }
        }

        function populateDatalists() {
            const subjects = [...new Set(rawResources.map(r => r.subject))].filter(Boolean);
            const branches = [...new Set(rawResources.map(r => r.branch))].filter(Boolean);
            document.getElementById('existing-subjects').innerHTML = subjects.map(s => `<option value="${s}">`).join('');
            document.getElementById('existing-branches').innerHTML = branches.map(b => `<option value="${b}">`).join('');
        }

        function getFilteredResources() {
            const searchTerm = document.getElementById('library-search').value.toLowerCase().trim();
            return rawResources.filter(r => {
                const matchType = currentTypeFilter === 'all' || r.type === currentTypeFilter;
                const matchSearch = !searchTerm || (r.title && r.title.toLowerCase().includes(searchTerm)) || (r.subject && r.subject.toLowerCase().includes(searchTerm));
                return matchType && matchSearch;
            });
        }

        function renderResources() {
            const resources = getFilteredResources();
            const container = document.getElementById('resources-tree-container');
            if (resources.length === 0) { container.innerHTML = `<div class="bg-slate-800 border border-slate-700 rounded-xl p-8 text-center text-slate-400">No resources found.</div>`; return; }

            const tree = {};
            resources.forEach(res => {
                const subj = res.subject || "General"; const branch = res.branch || "General / Main"; const type = res.type || "pdf";
                if (!tree[subj]) tree[subj] = { count: 0, branches: {} };
                if (!tree[subj].branches[branch]) tree[subj].branches[branch] = { count: 0, types: {} };
                if (!tree[subj].branches[branch].types[type]) tree[subj].branches[branch].types[type] = [];
                tree[subj].branches[branch].types[type].push(res); tree[subj].count++; tree[subj].branches[branch].count++;
            });

            let html = '';
            Object.keys(tree).forEach((subj, sIdx) => {
                const subjData = tree[subj];
                html += `<div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg"><div onclick="toggleAccordion('subj-${sIdx}')" class="p-4 bg-slate-800 hover:bg-slate-750 flex items-center justify-between cursor-pointer border-b border-slate-700/60"><div class="flex items-center gap-3"><i id="icon-subj-${sIdx}" class="fa-solid fa-chevron-right text-indigo-400 text-xs tree-toggle-icon"></i><span class="font-bold text-base text-slate-100"><i class="fa-solid fa-book text-indigo-400 mr-2"></i> ${subj}</span></div><span class="text-xs bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-full text-slate-400 font-semibold">${subjData.count} Files</span></div><div id="body-subj-${sIdx}" class="hidden p-4 space-y-4 bg-slate-900/40">`;
                Object.keys(subjData.branches).forEach((branch, bIdx) => {
                    const branchData = subjData.branches[branch];
                    html += `<div class="pl-2 sm:pl-4 border-l-2 border-indigo-500/30 space-y-3"><div onclick="toggleAccordion('branch-${sIdx}-${bIdx}')" class="flex items-center justify-between cursor-pointer py-1"><div class="flex items-center gap-2"><i id="icon-branch-${sIdx}-${bIdx}" class="fa-solid fa-chevron-right text-slate-400 text-[10px] tree-toggle-icon"></i><span class="font-semibold text-sm text-slate-200"><i class="fa-solid fa-folder-open text-amber-500 mr-1.5"></i> ${branch}</span></div><span class="text-[11px] text-slate-400 font-medium">${branchData.count} Items</span></div><div id="body-branch-${sIdx}-${bIdx}" class="hidden pl-3 sm:pl-6 space-y-3 pt-1">`;
                    Object.keys(branchData.types).forEach(type => {
                        const items = branchData.types[type];
                        html += `<div class="space-y-2"><div class="text-xs font-semibold text-slate-400 flex items-center gap-2 border-b border-slate-800 pb-1">${getTypeBadge(type)} (${items.length})</div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-1">`;
                        items.forEach(item => { html += renderResourceCard(item); });
                        html += `</div></div>`;
                    });
                    html += `</div></div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function renderResourceCard(item) {
            const icon = getTypeIcon(item.type);
            return `<div class="bg-slate-800 border border-slate-700 hover:border-indigo-500/50 p-3 rounded-xl transition shadow flex flex-col justify-between group"><div><div class="flex justify-between items-start gap-2 mb-2"><span class="text-lg text-indigo-400">${icon}</span>${isAdmin ? `<button onclick="deleteResource('${item.id}')" class="text-slate-500 hover:text-rose-400 text-xs transition p-1"><i class="fa-solid fa-trash-can"></i></button>` : ''}</div><h4 class="font-bold text-sm text-slate-200 group-hover:text-indigo-300 transition line-clamp-2">${item.title}</h4><p class="text-[11px] text-slate-400 mt-1">By ${item.uploadedBy || 'Admin'}</p></div><div class="mt-4 pt-2 border-t border-slate-700/60 flex gap-2"><a href="${item.fileUrl}" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open / Download</a></div></div>`;
        }

        function getTypeIcon(type) { switch(type) { case 'pdf': return '<i class="fa-solid fa-file-pdf text-rose-400"></i>'; case 'image': return '<i class="fa-solid fa-file-image text-blue-400"></i>'; case 'table': return '<i class="fa-solid fa-table-cells text-emerald-400"></i>'; case 'doc': return '<i class="fa-solid fa-file-word text-amber-400"></i>'; default: return '<i class="fa-solid fa-file text-slate-400"></i>'; } }
        function getTypeBadge(type) { switch(type) { case 'pdf': return '<span class="notion-tag tag-pdf"><i class="fa-solid fa-file-pdf"></i> PDF</span>'; case 'image': return '<span class="notion-tag tag-image"><i class="fa-solid fa-image"></i> Image</span>'; case 'table': return '<span class="notion-tag tag-table"><i class="fa-solid fa-table"></i> Table</span>'; case 'doc': return '<span class="notion-tag tag-doc"><i class="fa-solid fa-file-word"></i> Word</span>'; default: return '<span class="notion-tag bg-slate-700 text-slate-300">File</span>'; } }
        function toggleAccordion(id) { const body = document.getElementById(`body-${id}`); const icon = document.getElementById(`icon-${id}`); if (body && icon) { body.classList.toggle('hidden'); icon.classList.toggle('open'); } }
        function setTypeFilter(type) { currentTypeFilter = type; ['all', 'pdf', 'image', 'table', 'doc'].forEach(t => { const btn = document.getElementById(`type-filter-${t}`); if (btn) btn.className = (t === type) ? "px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition" : "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition"; }); renderResources(); }
        function filterResources() { renderResources(); }
        function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }

        // دالة الرفع المباشر المجانية والمضمونة 100%
        async function handleResourceSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-upload-btn');
            const statusBox = document.getElementById('upload-status');
            const fileInput = document.getElementById('res-file');

            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a file.");
                return;
            }

            if (!isAdmin || !window.firebaseAuth.currentUser) {
                alert("You are not authorized to upload resources.");
                return;
            }

            submitBtn.disabled = true;
            statusBox.classList.remove('hidden');
            statusBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Uploading file directly...';

            let uploadedFileUrl = "";

            try {
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('fileToUpload', file);

                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    uploadedFileUrl = (await response.text()).trim();
                }

                if (!uploadedFileUrl || !uploadedFileUrl.startsWith('http')) {
                    throw new Error("Could not process direct upload.");
                }

                statusBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Saving resource to Firebase...';

                const title = document.getElementById('res-title').value.trim();
                const subject = document.getElementById('res-subject').value.trim();
                const branch = document.getElementById('res-branch').value.trim();
                const type = document.getElementById('res-type').value;

                const user = window.firebaseAuth.currentUser;
                const { collection, addDoc, serverTimestamp } = window.firestoreTools;

                await addDoc(
                    collection(window.db, "resources"),
                    {
                        title,
                        subject,
                        branch,
                        type,
                        fileUrl: uploadedFileUrl,
                        fileName: file.name,
                        fileSize: file.size,
                        uploadedBy: user.email.split('@')[0],
                        timestamp: serverTimestamp()
                    }
                );

                alert("تم رفع الملف وحفظه في المكتبة بنجاح!");
                document.getElementById('upload-form').reset();
                closeUploadModal();
                await fetchResources();

            } catch (err) {
                console.error("Resource Upload Error:", err);
                alert("فشل رفع الملف:\n" + err.message);
            } finally {
                submitBtn.disabled = false;
                statusBox.classList.add('hidden');
            }
        }

        async function deleteResource(id) {
            if(!isAdmin) return;
            if (confirm("هل أنت متأكد من الحذف؟")) {
                try {
                    const { doc, deleteDoc } = window.firestoreTools;
                    await deleteDoc(doc(window.db, "resources", id));
                    alert("تم الحذف بنجاح.");
                    fetchResources();
                } catch(err) { alert("Error deleting: " + err.message); }
            }
        }
        
        window.onload = initLibrary;
    </script>
</body>
</html>
