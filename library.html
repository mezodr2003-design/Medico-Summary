    <script>
        const SUPER_ADMIN_EMAIL = "naheha1614@ensproxy.com";
        let allWrittenQuestions = [];
        let activeAnkiQueue = [];
        let currentAnkiIndex = 0;
        let isAnkiActiveMode = false;
        let selectedTaxonomySet = new Set();
        let ankiStatusFilter = null;
        let selfScores = JSON.parse(localStorage.getItem('medico_written_scores')) || {};

        // Active Highlighter State ('yellow', 'green', 'pink', or 'off')
        let currentHighlighterColor = 'yellow';

        function setTheme(mode) {
            const body = document.getElementById('app-body');
            body.classList.remove('theme-eyecare', 'theme-light');
            if(mode === 'eyecare') body.classList.add('theme-eyecare');
            if(mode === 'light') body.classList.add('theme-light');
            localStorage.setItem('medico_theme', mode);
        }

        // --- EXPLICIT HIGHLIGHTER BUTTON LOGIC ---
        function setActiveHighlighter(color) {
            currentHighlighterColor = color;
            ['yellow', 'green', 'pink', 'off'].forEach(c => {
                const btn = document.getElementById(`hl-btn-${c}`);
                if(!btn) return;
                if(c === color) {
                    if(c === 'off') {
                        btn.className = "px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-600 text-white border border-rose-500 shadow";
                    } else {
                        btn.className = `px-2.5 py-1 rounded-lg text-xs font-bold bg-${c === 'yellow' ? 'amber' : c === 'green' ? 'emerald' : 'pink'}-500/30 text-${c === 'yellow' ? 'amber' : c === 'green' ? 'emerald' : 'pink'}-300 border border-${c === 'yellow' ? 'amber' : c === 'green' ? 'emerald' : 'pink'}-500 shadow`;
                    }
                } else {
                    btn.className = "px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition";
                }
            });
        }

        document.addEventListener('mouseup', handleDirectHighlight);
        document.addEventListener('touchend', handleDirectHighlight);

        function handleDirectHighlight(e) {
            if(currentHighlighterColor === 'off') return;
            
            setTimeout(() => {
                const selection = window.getSelection();
                if (!selection.isCollapsed && selection.toString().trim().length > 0) {
                    applyHighlightDirect(currentHighlighterColor);
                }
            }, 60);
        }

        function applyHighlightDirect(color) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            
            const range = selection.getRangeAt(0);
            const colorMap = { 'yellow': 'custom-hl-yellow', 'green': 'custom-hl-green', 'pink': 'custom-hl-pink' };
            const className = colorMap[color] || 'custom-hl-yellow';

            try {
                const mark = document.createElement('mark');
                mark.className = className;
                range.surroundContents(mark);
            } catch(e) {
                const iterator = document.createNodeIterator(
                    range.commonAncestorContainer,
                    NodeFilter.SHOW_TEXT,
                    { acceptNode: function(node) {
                        return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                    }}
                );
                let node;
                const nodesToWrap = [];
                while ((node = iterator.nextNode())) {
                    if (node.nodeValue.trim().length > 0) nodesToWrap.push(node);
                }
                nodesToWrap.forEach(textNode => {
                    if (textNode.parentNode.nodeName !== 'MARK') {
                        const mark = document.createElement('mark');
                        mark.className = className;
                        textNode.parentNode.insertBefore(mark, textNode);
                        mark.appendChild(textNode);
                    }
                });
            }
            selection.removeAllRanges();
        }


        // --- STYLUS SCRATCHPAD LOGIC (Supports Samsung S-Pen & Palm Rejection) ---
        function toggleScratchpad(id) {
            const box = document.getElementById(`scratchpad-box-${id}`);
            if(!box) return;
            box.classList.toggle('hidden');
            if(!box.classList.contains('hidden')) {
                setTimeout(() => initCanvas(id), 50);
            }
        }

        function initCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if(!canvas) return;
            
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = 240;
            
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.strokeStyle = '#38bdf8'; // Light blue ink
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let drawing = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            // Samsung S-Pen & Pointer Events with Palm Rejection
            canvas.onpointerdown = (e) => {
                // If it's a finger touch, ignore it so user can scroll or touch UI normally
                if(e.pointerType === 'touch') return; 

                drawing = true;
                ctx.beginPath();
                const pos = getPos(e);
                ctx.moveTo(pos.x, pos.y);
                canvas.setPointerCapture(e.pointerId);
            };

            canvas.onpointermove = (e) => {
                if(!drawing) return;
                if(e.pointerType === 'touch') return; 
                
                e.preventDefault();
                const pos = getPos(e);
                
                if (e.pointerType === 'pen' && e.pressure) {
                    ctx.lineWidth = Math.max(1, e.pressure * 5);
                } else {
                    ctx.lineWidth = 2.5;
                }
                
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            canvas.onpointerup = (e) => {
                drawing = false;
                try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            };
            
            canvas.onpointerleave = () => { drawing = false; };
        }

        function clearScratchpad(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }


        // --- FIREBASE & INITIALIZATION ---
        async function initWrittenLibrary() {
            setTheme(localStorage.getItem('medico_theme') || 'dark');
            setActiveHighlighter('yellow');
            
            const checkFirebase = setInterval(async () => {
                if (window.db && window.firestoreTools) {
                    clearInterval(checkFirebase);
                    try {
                        const { collection, getDocs } = window.firestoreTools;
                        const snap = await getDocs(collection(window.db, "written_questions"));
                        allWrittenQuestions = [];
                        snap.forEach(doc => allWrittenQuestions.push({ id: doc.id, ...doc.data() }));
                        updateAnkiBadges();
                        renderTree();
                        renderQuestions();
                    } catch(err) { console.error("Error loading Qs:", err); }
                }
            }, 200);
        }

        function updateAnkiBadges() {
            let missed = 0, partial = 0, mastered = 0;
            allWrittenQuestions.forEach(q => {
                const s = selfScores[q.id];
                if(s === 'missed') missed++; else if(s === 'partial') partial++; else if(s === 'mastered') mastered++;
            });
            document.getElementById('count-missed').innerText = missed;
            document.getElementById('count-partial').innerText = partial;
            document.getElementById('count-mastered').innerText = mastered;
            document.getElementById('anki-total-badge').innerText = allWrittenQuestions.length;
        }

        function renderTree() {
            const container = document.getElementById('written-tree-container');
            const tree = {};
            allWrittenQuestions.forEach(q => {
                const subj = q.subject || "General", branch = q.branch || "General Branch", topic = q.topic || "General Topic";
                if(!tree[subj]) tree[subj] = { total: 0, branches: {} }; tree[subj].total++;
                if(!tree[subj].branches[branch]) tree[subj].branches[branch] = { total: 0, topics: {} }; tree[subj].branches[branch].total++;
                if(!tree[subj].branches[branch].topics[topic]) tree[subj].branches[branch].topics[topic] = 0; tree[subj].branches[branch].topics[topic]++;
            });

            let html = '';
            Object.keys(tree).sort().forEach(subj => {
                const subjData = tree[subj];
                html += `<div class="glass-card rounded-xl p-2.5 border border-slate-800/80 space-y-1.5"><div class="font-bold text-slate-200 flex justify-between items-center"><label class="flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" onchange="toggleSubjectCheck('${subj}', this.checked)" class="w-3.5 h-3.5 rounded accent-indigo-500"><span>${subj}</span></label><span class="text-[10px] bg-slate-950 px-2 py-0.5 rounded-full text-indigo-400 font-mono">${subjData.total}</span></div><div class="pl-4 space-y-1 border-l border-slate-800/60 mt-1">`;
                Object.keys(subjData.branches).sort().forEach(branch => {
                    const branchData = subjData.branches[branch];
                    html += `<div class="space-y-1"><div class="flex justify-between items-center text-slate-300 font-semibold text-[11px]"><label class="flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" onchange="toggleBranchCheck('${subj}', '${branch}', this.checked)" class="w-3 h-3 rounded accent-indigo-500"><span>${branch}</span></label><span class="font-mono text-[9px] text-slate-500">${branchData.total}</span></div><div class="pl-3 space-y-0.5 border-l border-slate-800/40 ml-1">`;
                    Object.keys(branchData.topics).sort().forEach(topic => {
                        const key = `${subj}||${branch}||${topic}`; const isChecked = selectedTaxonomySet.has(key);
                        html += `<div class="flex items-center justify-between text-slate-400 text-[10px]"><label class="flex items-center gap-1.5 cursor-pointer select-none"><input type="checkbox" onchange="toggleTopicCheck('${key}', this.checked)" ${isChecked ? 'checked' : ''} class="w-3 h-3 rounded accent-indigo-500"><span>${topic}</span></label><span class="font-mono text-[9px] text-slate-600">${branchData.topics[topic]}</span></div>`;
                    });
                    html += `</div></div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html || '<p class="text-slate-500 text-center py-2">No written questions found.</p>';
        }

        function toggleSubjectCheck(subj, isChecked) { allWrittenQuestions.forEach(q => { if((q.subject || "General") === subj) { const key = `${q.subject || "General"}||${q.branch || "General Branch"}||${q.topic || "General Topic"}`; if(isChecked) selectedTaxonomySet.add(key); else selectedTaxonomySet.delete(key); } }); renderTree(); renderQuestions(); }
        function toggleBranchCheck(subj, branch, isChecked) { allWrittenQuestions.forEach(q => { if((q.subject || "General") === subj && (q.branch || "General Branch") === branch) { const key = `${subj}||${branch}||${q.topic || "General Topic"}`; if(isChecked) selectedTaxonomySet.add(key); else selectedTaxonomySet.delete(key); } }); renderTree(); renderQuestions(); }
        function toggleTopicCheck(key, isChecked) { if(isChecked) selectedTaxonomySet.add(key); else selectedTaxonomySet.delete(key); renderQuestions(); }
        function selectAllTree(selectAll) { selectedTaxonomySet.clear(); if(selectAll) { allWrittenQuestions.forEach(q => { const key = `${q.subject || "General"}||${q.branch || "General Branch"}||${q.topic || "General Topic"}`; selectedTaxonomySet.add(key); }); } renderTree(); renderQuestions(); }

        function getFilteredQuestionsPool() {
            const searchVal = document.getElementById('library-search').value.toLowerCase().trim();
            return allWrittenQuestions.filter(q => {
                if(ankiStatusFilter) { if(selfScores[q.id] !== ankiStatusFilter) return false; }
                const key = `${q.subject || "General"}||${q.branch || "General Branch"}||${q.topic || "General Topic"}`;
                if(selectedTaxonomySet.size > 0 && !selectedTaxonomySet.has(key)) return false;
                if(searchVal) { const qText = (q.question || '').toLowerCase(); const ansText = (q.modelAnswer || '').toLowerCase(); if(!qText.includes(searchVal) && !ansText.includes(searchVal)) return false; }
                return true;
            });
        }

        function startAnkiSession() {
            const pool = getFilteredQuestionsPool();
            if(pool.length === 0) return alert("No questions selected or matching your filter.");

            const missedList = pool.filter(q => selfScores[q.id] === 'missed');
            const partialList = pool.filter(q => selfScores[q.id] === 'partial');
            const remaining = pool.filter(q => !selfScores[q.id] || selfScores[q.id] === 'unrated');

            activeAnkiQueue = [...missedList, ...partialList, ...remaining];
            if(activeAnkiQueue.length === 0) activeAnkiQueue = [...pool];

            currentAnkiIndex = 0;
            isAnkiActiveMode = true;

            document.body.classList.add('anki-focus-mode');
            document.getElementById('written-questions-list').classList.add('hidden');
            document.getElementById('anki-single-card-view').classList.remove('hidden');
            document.getElementById('print-btn').classList.add('hidden');

            renderAnkiSingleCard();
        }

        function renderAnkiSingleCard() {
            if(activeAnkiQueue.length === 0 || currentAnkiIndex >= activeAnkiQueue.length) {
                document.getElementById('anki-card-container').innerHTML = `
                <div class="glass-panel p-12 text-center space-y-4 rounded-2xl border border-emerald-500/40 w-full shadow-2xl">
                    <i class="fa-solid fa-trophy text-amber-400 text-6xl animate-bounce"></i>
                    <h3 class="font-extrabold text-slate-100 text-2xl">Block Completed! 🎉</h3>
                    <p class="text-sm text-slate-300">You have reviewed all active flashcards in this queue.</p>
                    <button onclick="exitAnkiSession()" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-3 rounded-xl text-sm uppercase tracking-wider shadow-lg">Return to Library</button>
                </div>`;
                return;
            }

            const q = activeAnkiQueue[currentAnkiIndex];
            document.getElementById('anki-current-index').innerText = currentAnkiIndex + 1;
            document.getElementById('anki-total-cards').innerText = activeAnkiQueue.length;
            const progress = ((currentAnkiIndex + 1) / activeAnkiQueue.length) * 100;
            document.getElementById('anki-progress-bar').style.width = `${progress}%`;

            document.getElementById('anki-card-container').innerHTML = `
            <div class="glass-panel rounded-2xl p-6 sm:p-10 border border-indigo-500/30 shadow-2xl space-y-6 w-full">
                <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800 pb-4">
                    <div class="flex items-center gap-2 text-xs font-semibold">
                        <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-md uppercase tracking-wider">${q.subject || 'General'}</span>
                        <span class="bg-slate-800 text-slate-300 px-3 py-1 rounded-md">${q.branch || 'General'}</span>
                        ${q.topic ? `<span class="bg-slate-900 text-slate-400 px-2.5 py-1 rounded text-xs">${q.topic}</span>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        ${q.marks ? `<span class="text-sm font-mono font-bold text-amber-400 bg-amber-500/10 px-3 py-1 rounded border border-amber-500/20">${q.marks}</span>` : ''}
                    </div>
                </div>

                <div class="text-slate-100 font-bold text-lg sm:text-xl leading-relaxed select-text">
                    ${q.question}
                </div>

                <!-- Stylus Scratchpad Button & Workspace -->
                <div class="space-y-3 pt-2">
                    <button onclick="toggleScratchpad('${q.id}')" class="text-xs bg-slate-900 hover:bg-slate-800 text-amber-400 border border-amber-500/40 px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition shadow">
                        <i class="fa-solid fa-pen-nib"></i> <span>Stylus Pen Scratchpad</span>
                    </button>
                    
                    <div id="scratchpad-box-${q.id}" class="hidden glass-card p-3 rounded-xl border border-amber-500/30 space-y-2">
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span class="font-semibold text-amber-400"><i class="fa-solid fa-signature"></i> Write / Draw with S-Pen (Palm Rejection Enabled):</span>
                            <button onclick="clearScratchpad('${q.id}')" class="text-[10px] bg-rose-600/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded font-bold hover:bg-rose-600 hover:text-white transition">Clear Canvas</button>
                        </div>
                        <div class="scratchpad-container">
                            <canvas id="canvas-${q.id}" class="scratchpad-canvas"></canvas>
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800">
                    <button onclick="toggleAnkiAnswer('${q.id}')" class="w-full text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 active:scale-95">
                        <i class="fa-solid fa-eye"></i> <span id="btn-txt-single-${q.id}">Show Model Answer</span>
                    </button>
                </div>

                <div id="ans-box-single-${q.id}" class="hidden mt-4 glass-card border-l-4 border-emerald-500 rounded-r-xl p-6 sm:p-8 space-y-6">
                    <h4 class="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2 pb-3 border-b border-slate-800">
                        <i class="fa-solid fa-check-double"></i> Model Answer & Key Points
                    </h4>
                    
                    <div class="model-answer-content text-base select-text">${q.modelAnswer || 'No model answer available.'}</div>
                    
                    <div class="pt-6 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <span class="text-sm text-slate-400 font-bold uppercase tracking-wider">Rate Your Recall:</span>
                        <div class="grid grid-cols-3 gap-3 w-full sm:w-auto">
                            <button onclick="rateSingleAnkiCard('${q.id}', 'missed')" class="text-xs px-5 py-3 rounded-xl font-bold bg-slate-900 hover:bg-rose-950 text-rose-400 border border-rose-500/40 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Repeat Soon
                            </button>
                            <button onclick="rateSingleAnkiCard('${q.id}', 'partial')" class="text-xs px-5 py-3 rounded-xl font-bold bg-slate-900 hover:bg-amber-950 text-amber-400 border border-amber-500/40 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-hourglass-half"></i> End of Block
                            </button>
                            <button onclick="rateSingleAnkiCard('${q.id}', 'mastered')" class="text-xs px-5 py-3 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i> Got It Easy
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleAnkiAnswer(id) {
            const box = document.getElementById(`ans-box-single-${id}`);
            const btnTxt = document.getElementById(`btn-txt-single-${id}`);
            box.classList.toggle('hidden');
            btnTxt.innerText = box.classList.contains('hidden') ? "Show Model Answer" : "Hide Model Answer";
        }

        function rateSingleAnkiCard(id, score) {
            selfScores[id] = score;
            localStorage.setItem('medico_written_scores', JSON.stringify(selfScores));
            updateAnkiBadges();
            const currentQ = activeAnkiQueue[currentAnkiIndex];
            if(score === 'missed') {
                const insertIdx = Math.min(currentAnkiIndex + 3, activeAnkiQueue.length);
                activeAnkiQueue.splice(insertIdx, 0, currentQ);
            } else if(score === 'partial') {
                activeAnkiQueue.push(currentQ);
            }
            currentAnkiIndex++;
            renderAnkiSingleCard();
        }

        function exitAnkiSession() {
            isAnkiActiveMode = false;
            document.body.classList.remove('anki-focus-mode');
            document.getElementById('written-questions-list').classList.remove('hidden');
            document.getElementById('anki-single-card-view').classList.add('hidden');
            document.getElementById('print-btn').classList.remove('hidden');
            document.getElementById('active-topic-title').innerText = "All Written Questions";
            renderQuestions();
        }

        function renderQuestions() {
            if(isAnkiActiveMode) return;
            const container = document.getElementById('written-questions-list');
            const filtered = getFilteredQuestionsPool();

            if(filtered.length === 0) { container.innerHTML = '<p class="text-slate-400 text-center py-8">No written questions match your selection.</p>'; return; }

            let html = '';
            filtered.forEach((q, idx) => {
                const currentScore = selfScores[q.id] || null;
                html += `
                <div class="glass-panel rounded-2xl p-5 border border-slate-800 shadow-lg space-y-3">
                    <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800/80 pb-2.5">
                        <div class="flex items-center gap-2 text-xs font-semibold">
                            <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 px-2.5 py-0.5 rounded-md">${q.subject || 'General'}</span>
                            <span class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-md">${q.branch || 'General'}</span>
                        </div>
                    </div>
                    <div class="text-slate-100 font-medium text-sm sm:text-base leading-relaxed select-text">
                        <span class="text-indigo-400 font-bold font-mono mr-1">Q${idx+1}.</span> ${q.question}
                    </div>
                    <div class="pt-2">
                        <button onclick="toggleAnswer('${q.id}')" class="text-xs bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5">
                            <i class="fa-solid fa-lightbulb"></i> <span id="btn-txt-${q.id}">Show Model Answer</span>
                        </button>
                    </div>
                    <div id="ans-box-${q.id}" class="hidden mt-3 glass-card border-l-4 border-emerald-500 rounded-r-xl p-4 space-y-3">
                        <div class="model-answer-content overflow-x-auto select-text">${q.modelAnswer || 'No model answer available.'}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function toggleAnswer(id) {
            const box = document.getElementById(`ans-box-${id}`);
            const btnTxt = document.getElementById(`btn-txt-${id}`);
            box.classList.toggle('hidden');
            btnTxt.innerText = box.classList.contains('hidden') ? "Show Model Answer" : "Hide Model Answer";
        }

        function filterByAnkiStatus(status) { ankiStatusFilter = status; document.getElementById('active-topic-title').innerText = `Deck: ${status.toUpperCase()} Questions`; renderQuestions(); }
        function clearFilter() { selectedTaxonomySet.clear(); ankiStatusFilter = null; document.getElementById('active-topic-title').innerText = "All Written Questions"; renderTree(); renderQuestions(); }
        function filterQuestions() { renderQuestions(); }

        window.onload = initWrittenLibrary;
    </script>
</body>
</html>
